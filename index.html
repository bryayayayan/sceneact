<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCENARIO ACTIVITY</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="day-background">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="bird"></div> 
        <div class="bird"></div> 
        <div class="bird"></div> 
    </div>
      
    <div class="night-background">
        <div class="moon"></div>
        <div class="firefly firefly1"></div>
        <div class="firefly firefly2"></div>
        <div class="firefly firefly3"></div>
    </div>

    <div class="container">
        <div id="text" class="fade-in">Choose what you want!</div>

        <img id="logo" class="fade-in" src="APPLE LOGO.png" alt="Logo" />

        <div class="button-group">
            <button onclick="changeLogo()">🔁 Change Logo</button>
            <button onclick="changeFont()">✍️ Change Font</button>
            <button onclick="changeTextColor()">🎨 Change Text Color</button>
            <button onclick="toggleMode()">🌙 Toggle Mode</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
